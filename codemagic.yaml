workflows:
  android-workflow:
    name: SwapSkill Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.27.1
      java: 17
      vars:
        PACKAGE_NAME: "com.swapskil"
    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
          flutter config --no-analytics
      - name: Clean previous builds
        script: |
          flutter clean
          rm -f pubspec.lock
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter analyze (non-blocking)
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build APK (release)
        script: |
          flutter build apk --release --no-tree-shake-icons
      - name: Build AAB (release)
        script: |
          flutter build appbundle --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

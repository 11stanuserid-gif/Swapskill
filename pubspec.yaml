name: swapskill_app
description: SwapSkill - Skill barter platform connecting learners across India
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_animate: ^4.3.0
  flutter_screenutil: ^5.9.0
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.1.0

  # State Management
  provider: ^6.1.1

  # Routing
  go_router: ^12.1.3

  # Networking
  dio: ^5.4.0
  http: ^1.1.2
  socket_io_client: ^2.0.3+1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.1

  # Auth
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  google_sign_in: ^6.1.6
  firebase_messaging: ^14.7.9
  firebase_analytics: ^10.7.4

  # Video Call (Agora)
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.1.0

  # Media
  image_picker: ^1.0.5
  video_player: ^2.8.1
  camera: ^0.10.5+9
  file_picker: ^6.1.1

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  package_info_plus: ^4.2.0
  device_info_plus: ^9.1.1
  connectivity_plus: ^5.0.2
  uuid: ^4.2.1
  logger: ^2.0.2+1
  equatable: ^2.0.5
  collection: ^1.18.0

  # Date/Time
  table_calendar: ^3.0.9

  # Forms
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1

  # Notifications
  flutter_local_notifications: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

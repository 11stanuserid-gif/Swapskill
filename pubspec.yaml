name: swapskill_app
description: SwapSkill - Skill barter platform connecting learners across India
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  flutter_screenutil: ^5.9.3
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0
  http: ^1.2.2
  socket_io_client: ^2.0.3+1

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # Auth - Firebase (latest stable)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3

  # Video Call (Agora)
  agora_rtc_engine: ^6.5.4
  permission_handler: ^11.3.1

  # Media
  image_picker: ^1.1.2
  video_player: ^2.9.2
  camera: ^0.11.0+2
  file_picker: ^8.1.2

  # ⭐ CRITICAL: intl pinned to 0.20.2 (matches flutter_localizations)
  intl: ^0.20.2

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1
  logger: ^2.4.0
  equatable: ^2.0.5
  collection: ^1.18.0

  # Date/Time
  table_calendar: ^3.1.2

  # Forms
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1

  # Notifications
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

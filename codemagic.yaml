workflows:
  android-workflow:
    name: SwapSkill Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.27.1
      java: 17
      vars:
        PACKAGE_NAME: "com.swapskil"
    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
          flutter config --no-analytics
      - name: Clean previous builds
        script: |
          flutter clean
          rm -f pubspec.lock
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter analyze (non-blocking)
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build APK (Debug) - for testing
        script: |
          flutter build apk --debug --no-tree-shake-icons
      - name: Build APK (Release) - for installation
        script: |
          flutter build apk --release --no-tree-shake-icons
      - name: Build AAB (Release) - for Play Store
        script: |
          flutter build appbundle --release --no-tree-shake-icons
      - name: List build outputs
        script: |
          echo "=== APK files ==="
          find build -name "*.apk" -type f
          echo "=== AAB files ==="
          find build -name "*.aab" -type f
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/apk/**/*.apk
      - build/app/outputs/bundle/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

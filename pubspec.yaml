name: swapskill_app
description: SwapSkill - Skill barter platform connecting learners across India
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  flutter_screenutil: ^5.9.3
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.1.0

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.2.7

  # Networking
  dio: ^5.5.0+1
  http: ^1.2.2
  socket_io_client: ^2.0.3+1

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # Auth - Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.0.4
  firebase_analytics: ^11.2.1

  # Video Call (Agora)
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1

  # Media
  image_picker: ^1.1.2
  video_player: ^2.9.1
  camera: ^0.11.0+1
  file_picker: ^8.0.6

  # Utilities — intl pinned to match Flutter SDK 3.24+ (flutter_localizations needs 0.19.x or 0.20.x)
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.5
  uuid: ^4.4.2
  logger: ^2.4.0
  equatable: ^2.0.5
  collection: ^1.18.0

  # Date/Time
  table_calendar: ^3.1.2

  # Forms
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1

  # Notifications
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
